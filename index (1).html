<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanu Bot - Buatan Sendiri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #00ffcc;
            margin-top: 0;
        }
        #chat-container {
            flex: 1;
            background-color: #111e1e;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #333;
            max-height: 70vh;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .ai {
            background-color: #333;
            color: #99ffcc;
        }
        .user {
            background-color: #088bff;
            color: white;
            margin-left: auto;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #222;
            color: white;
            outline: none;
        }
        input:focus {
            border-color: #00ffcc;
        }
        button {
            padding: 10px 15px;
            border: none;
            background-color: #00ffcc;
            color: #121212;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h2>Proto Nanu Bot</h2>
    
    <div id="chat-container">
        <div class="message ai">Halo! Aku! Nanu Bot! Ada yang bisa dibantu?</div>
    </div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="Ketik sesuatu..." onkeypress="handleKeyPress(event)">
        <button onclick="kirimPesan()">Send</button>
        <button onclick="resetChat()" style="background-color: #ff1066; color: white;">New Chat</button>
    </div>

    <script>
        function kirimPesan() {
            const inputField = document.getElementById("userInput");
            const chatContainer = document.getElementById("chat-container");
            const pesanUser = inputField.value.trim();

            if (pesanUser === "") return;

            // Tampilkan pesan user
            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "message user";
            userMsgDiv.textContent = pesanUser;
            chatContainer.appendChild(userMsgDiv);
            
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Simulasi balasan AI otomatis setelah 1 detik
            setTimeout(() => {
                let balasanAI = "Kotak Teks Tidak Tersedia.. Maaf!";
                const teksKecil = pesanUser.toLowerCase();
                
                if (teksKecil.includes("halo") || teksKecil.includes("hai") || teksKecil.includes("yo") || teksKecil.includes("hello") || teksKecil.includes("hi") || teksKecil.includes("helo"))  {
                    balasanAI = "Hai juga! Ada yang bisa dibantu?";
                } else if (teksKecil.includes("siapa kamu") || teksKecil.includes("lo siapa") || teksKecil.includes("kamu siapa")) {
                    balasanAI = "Aku! Nanu Bot! Teman pribadimu!";
                } else if (teksKecil.includes("siapa itu kay")) {
                    balasanAI = "Kay? Dia adalah teman George dari novel SNKR! Selain Kay, ada juga loh temannya yang lain! Yakni Naoki!";
                } else if (teksKecil.includes("siapa itu naoki")) {
                    balasanAI = "Naoki? Dia Adalah Teman George Dari Novel SNKR!";
                } else if (teksKecil.includes("siapa itu ryuzen")) {
                    balasanAI = "Ryuzen? Dia Adalah Salah Satu Villain Di Novel SNKR!";
                } else if (teksKecil.includes("hobi mu apa") || teksKecil.includes("apa hobi mu")) { 
                    balasanAI = "Hobiku Ngobrol Sama Kamu! Ada Yang Perlu Ditanyakan Lagi?";
                } else if (teksKecil.includes("siapa pendiri nanu bot")) { 
                    balasanAI = "Pendiri Nanu Bot? Dia Adalah Greg!";
                } else if (teksKecil.includes("siapa itu verity")) { 
                    balasanAI = "Verity? oh! Dia Adalah Mahluk Dari Mod Minecraft! Yang Bentuknya Berbola Kuning Kan?"; 
                } else if (teksKecil.includes("apa itu jojo")) { 
                    balasanAI = "Jojo? Anime Jojo Atau Di Kenal JJBA, Di Buat Oleh Hirohiko Araki, Terkenal Karna Karakter Buatannya Yang Bizzare.."; 
                } else if (teksKecil.includes("apa itu jjk")) { 
                    balasanAI = "JJK Atau Jujutsu Kaisen Merupakan Anime Tentang Melawan Kutukan! Dengan Tokoh Utama Yuji Itadori! Dan Mangakanya Adalah Gege Akutami!"; 
                } else if (teksKecil.includes("kontol") || teksKecil.includes("memek") || teksKecil.includes("Nigger")) { 
                    balasanAI = "Hei Itu Kata kasar.. Jangan Di Ucapkan Ya!"; 
                }

                // Tampilkan pesan AI
                const aiMsgDiv = document.createElement("div");
                aiMsgDiv.className = "message ai";
                aiMsgDiv.textContent = balasanAI;
                chatContainer.appendChild(aiMsgDiv);

                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1000);

            // Fokuskan kembali ke input setelah mengirim
            inputField.focus();
        }

        // Fungsi untuk mereset/membuat chat baru
        function resetChat() {
            const chatContainer = document.getElementById("chat-container");
            chatContainer.innerHTML = '<div class="message ai">Halo! Aku! Nanu Bot! Ada yang bisa dibantu?</div>';
        }

        // Fitur tambahan: Bisa tekan tombol Enter di keyboard untuk mengirim pesan
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                kirimPesan();
            }
        }
    </script>

</body>
</html>
